<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ShopEase</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #2874f0;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      background: #2874f0;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1557c0;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: red;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>ShopEase</h1>
    <h2>Admin Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Admin Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="message"></p>

  </div>

  <script>

    function login() {

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      // Demo credentials
      if (username === "admin" && password === "admin123") {

        sessionStorage.setItem("adminLoggedIn", "true");

        window.location.href = "/admin.html";

      } else {

        document.getElementById("message").textContent =
          "Invalid username or password.";

      }
    }

  </script>

</body>
</html>
