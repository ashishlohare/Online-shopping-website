<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ShopEase Admin</title>

<style>

body {
    font-family: Arial;
    background: #f1f3f6;
    margin: 0;
}

header {
    background: #131921;
    color: white;
    padding: 20px 6%;
}

header h1 {
    color: #ff9900;
}

.orders {
    padding: 30px 6%;
}

.order {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ccc;
}

.order h2 {
    color: #2874f0;
}

.order p {
    margin: 8px 0;
}

.status {
    padding: 10px;
    margin-top: 15px;
}

select {
    padding: 10px;
    border-radius: 5px;
}

.refresh {
    background: #ff9900;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

</style>

</head>


<body>

<header>

    <h1>ShopEase Admin</h1>

    <p>📦 Order Management</p>

</header>


<section class="orders">

    <button
        class="refresh"
        onclick="loadOrders()">

        🔄 Refresh Orders

    </button>

    <br><br>

    <div id="orders"></div>

</section>


<script>

async function loadOrders() {

    const response =
        await fetch("/api/orders");

    const orders =
        await response.json();


    const container =
        document.getElementById("orders");

    container.innerHTML = "";


    if (orders.length === 0) {

        container.innerHTML =
            "<h2>No orders yet.</h2>";

        return;
    }


    orders.reverse().forEach(order => {

        let products = "";

        order.items.forEach(item => {

            products += `
                <li>
                    ${item.name}
                    × ${item.quantity}
                    — ₹${item.price}
                </li>
            `;

        });


        container.innerHTML += `

            <div class="order">

                <h2>
                    ${order.id}
                </h2>

                <p>
                    📅 ${order.date}
                </p>

                <hr>

                <h3>
                    Customer Details
                </h3>

                <p>
                    👤 ${order.customerName}
                </p>

                <p>
                    📞 ${order.phone}
                </p>

                <p>
                    📍 ${order.address},
                    ${order.city} -
                    ${order.pincode}
                </p>

                <hr>

                <h3>
                    Products
                </h3>

                <ul>
                    ${products}
                </ul>

                <h2>
                    Total: ₹${order.total}
                </h2>

                <div class="status">

                    Status:

                    <select
                        onchange="updateStatus(
                            '${order.id}',
                            this.value
                        )">

                        <option
                            ${order.status === "Pending"
                            ? "selected" : ""}>
                            Pending
                        </option>

                        <option
                            ${order.status === "Confirmed"
                            ? "selected" : ""}>
                            Confirmed
                        </option>

                        <option
                            ${order.status === "Shipped"
                            ? "selected" : ""}>
                            Shipped
                        </option>

                        <option
                            ${order.status === "Delivered"
                            ? "selected" : ""}>
                            Delivered
                        </option>

                        <option
                            ${order.status === "Cancelled"
                            ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>

        `;

    });

}


async function updateStatus(id, status) {

    await fetch(
        "/api/orders/" + id,
        {

            method: "PUT",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                status: status
            })

        }
    );

    alert("Order status updated!");

    loadOrders();

}


loadOrders();

</script>

</body>

</html>
