<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Online Shopping</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #2874f0;
      color: white;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 25px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      display: flex;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .cart-btn {
      background: white;
      color: #2874f0;
      border: none;
      padding: 11px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .categories {
      background: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px #ccc;
    }

    .categories button {
      margin: 5px;
      padding: 10px 18px;
      border: 1px solid #2874f0;
      background: white;
      color: #2874f0;
      border-radius: 20px;
      cursor: pointer;
    }

    .categories button:hover,
    .categories button.active {
      background: #2874f0;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #ddd;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product h3 {
      margin: 12px 0 8px;
    }

    .price {
      color: #388e3c;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .product button {
      background: #ff9f00;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .product button:hover {
      background: #fb8c00;
    }

    #cart {
      background: white;
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #ddd;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      gap: 10px;
    }

    .qty button {
      padding: 4px 9px;
      cursor: pointer;
    }

    .remove {
      background: #e53935;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    .checkout {
      margin-top: 25px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }

    .checkout input,
    .checkout textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .order-btn {
      width: 100%;
      padding: 14px;
      background: #2874f0;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    .order-btn:hover {
      background: #1557c0;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .cart-btn {
        width: 100%;
      }

      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ShopEase</h1>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search for products..."
        oninput="filterProducts()"
      >
    </div>

    <button class="cart-btn" onclick="scrollToCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <div class="categories">
    <button class="active" onclick="selectCategory('All', this)">All</button>
    <button onclick="selectCategory('Electronics', this)">Electronics</button>
    <button onclick="selectCategory('Fashion', this)">Fashion</button>
    <button onclick="selectCategory('Shoes', this)">Shoes</button>
    <button onclick="selectCategory('Home', this)">Home</button>
  </div>

  <div class="container">

    <h2 style="margin-bottom:20px;">Products</h2>

    <div class="products" id="products"></div>

    <div id="cart">
      <h2>🛒 Your Cart</h2>

      <div id="cartItems"></div>

      <div class="total">
        Total: ₹<span id="cartTotal">0</span>
      </div>

      <div class="checkout">
        <h2>Delivery Details</h2>

        <input
          type="text"
          id="customerName"
          placeholder="Your Name"
        >

        <input
          type="tel"
          id="customerPhone"
          placeholder="Mobile Number"
        >

        <textarea
          id="customerAddress"
          rows="4"
          placeholder="Delivery Address"
        ></textarea>

        <button class="order-btn" onclick="placeOrder()">
          Place Order
        </button>
      </div>
    </div>

  </div>

  <script>

    const products = [
      {
        id: 1,
        name: "Smartphone",
        price: 14999,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
      },
      {
        id: 2,
        name: "Wireless Headphones",
        price: 1999,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
      },
      {
        id: 3,
        name: "Men's Casual Shirt",
        price: 799,
        category: "Fashion",
        image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500"
      },
      {
        id: 4,
        name: "Running Shoes",
        price: 2499,
        category: "Shoes",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
      },
      {
        id: 5,
        name: "Smart Watch",
        price: 2999,
        category: "Electronics",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
      },
      {
        id: 6,
        name: "Home Lamp",
        price: 999,
        category: "Home",
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500"
      },
      {
        id: 7,
        name: "Women's Handbag",
        price: 1299,
        category: "Fashion",
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
      },
      {
        id: 8,
        name: "Sports Shoes",
        price: 1899,
        category: "Shoes",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
      }
    ];

    let cart = [];
    let selectedCategory = "All";

    function renderProducts(list = products) {

      const productContainer = document.getElementById("products");

      if (list.length === 0) {
        productContainer.innerHTML =
          `<div class="empty">No products found.</div>`;
        return;
      }

      productContainer.innerHTML = list.map(product => {

        return `
          <div class="product">

            <img
              src="${product.image}"
              alt="${product.name}"
            >

            <h3>${product.name}</h3>

            <p>${product.category}</p>

            <div class="price">
              ₹${product.price}
            </div>

            <button onclick="addToCart(${product.id})">
              Add to Cart
            </button>

          </div>
        `;

      }).join("");
    }

    function addToCart(id) {

      const product = products.find(p => p.id === id);

      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.quantity++;
      } else {
        cart.push({
          ...product,
          quantity: 1
        });
      }

      updateCart();

      alert(product.name + " added to cart!");
    }

    function updateCart() {

      const cartItems = document.getElementById("cartItems");

      if (cart.length === 0) {

        cartItems.innerHTML =
          `<div class="empty">Your cart is empty.</div>`;

        document.getElementById("cartTotal").textContent = "0";
        document.getElementById("cartCount").textContent = "0";

        return;
      }

      cartItems.innerHTML = cart.map(item => {

        return `
          <div class="cart-item">

            <div>
              <strong>${item.name}</strong>
              <br>
              ₹${item.price} × ${item.quantity}
            </div>

            <div class="qty">
              <button onclick="changeQuantity(${item.id}, -1)">
                -
              </button>

              <strong>${item.quantity}</strong>

              <button onclick="changeQuantity(${item.id}, 1)">
                +
              </button>
            </div>

            <button
              class="remove"
              onclick="removeFromCart(${item.id})"
            >
              Remove
            </button>

          </div>
        `;

      }).join("");

      let total = 0;
      let count = 0;

      cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;
      });

      document.getElementById("cartTotal").textContent = total;
      document.getElementById("cartCount").textContent = count;
    }

    function changeQuantity(id, change) {

      const item = cart.find(item => item.id === id);

      if (!item) return;

      item.quantity += change;

      if (item.quantity <= 0) {
        cart = cart.filter(item => item.id !== id);
      }

      updateCart();
    }

    function removeFromCart(id) {

      cart = cart.filter(item => item.id !== id);

      updateCart();
    }

    function selectCategory(category, button) {

      selectedCategory = category;

      document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      filterProducts();
    }

    function filterProducts() {

      const searchText =
        document.getElementById("searchInput")
          .value
          .toLowerCase();

      const filtered = products.filter(product => {

        const matchesSearch =
          product.name.toLowerCase().includes(searchText) ||
          product.category.toLowerCase().includes(searchText);

        const matchesCategory =
          selectedCategory === "All" ||
          product.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      renderProducts(filtered);
    }

    function scrollToCart() {

      document.getElementById("cart")
        .scrollIntoView({
          behavior: "smooth"
        });
    }

    async function placeOrder() {

      if (cart.length === 0) {
        alert("Please add products to cart first.");
        return;
      }

      const name =
        document.getElementById("customerName").value.trim();

      const phone =
        document.getElementById("customerPhone").value.trim();

      const address =
        document.getElementById("customerAddress").value.trim();

      if (!name || !phone || !address) {
        alert("Please fill all delivery details.");
        return;
      }

      const total = cart.reduce(
        (sum, item) =>
          sum + item.price * item.quantity,
        0
      );

      const order = {
        customerName: name,
        phone: phone,
        address: address,
        items: cart,
        total: total,
        status: "Pending"
      };

      try {

        const response = await fetch("/api/orders", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(order)

        });

        const data = await response.json();

        if (response.ok) {

          alert(
            "Order placed successfully! 🎉\nOrder ID: " +
            data.id
          );

          cart = [];

          document.getElementById("customerName").value = "";
          document.getElementById("customerPhone").value = "";
          document.getElementById("customerAddress").value = "";

          updateCart();

        } else {

          alert(
            data.message || "Order placement failed."
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "Server error. Please try again."
        );
      }
    }

    renderProducts();
    updateCart();

  </script>

</body>
</html>
