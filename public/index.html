<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #131921;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ff9900;
        }

        .products {
            padding: 40px 6%;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin-top: 12px;
        }

        .price {
            color: #e47911;
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }

        button {
            background: #ff9900;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart {
            background: white;
            margin: 20px 6%;
            padding: 25px;
            border-radius: 10px;
        }

        .cart-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .checkout {
            margin: 20px 6%;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        textarea {
            height: 90px;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>ShopEase</h1>

    <h3>
        🛒 Cart:
        <span id="cartCount">0</span>
    </h3>

</header>


<section class="products" id="products"></section>


<section class="cart">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <br>

    <h2>
        Total: ₹<span id="total">0</span>
    </h2>

</section>


<section class="checkout">

    <h2>📦 Delivery Details</h2>

    <br>

    <input
        id="name"
        placeholder="Full Name"
    >

    <input
        id="phone"
        placeholder="Mobile Number"
        type="tel"
    >

    <textarea
        id="address"
        placeholder="Full Address"
    ></textarea>

    <input
        id="city"
        placeholder="City"
    >

    <input
        id="pincode"
        placeholder="Pincode"
    >

    <button onclick="placeOrder()">
        Place Order
    </button>

    <div id="message"></div>

</section>


<script>

const products = [

    {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        image:
        "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
    },

    {
        id: 2,
        name: "Smart Watch",
        price: 2499,
        image:
        "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
    },

    {
        id: 3,
        name: "Running Shoes",
        price: 1899,
        image:
        "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
    },

    {
        id: 4,
        name: "Backpack",
        price: 1299,
        image:
        "https://images.unsplash.com/photo-1553062407-98eeb64c6a62"
    }

];


let cart = [];


function displayProducts() {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        container.innerHTML += `

            <div class="product">

                <img src="${product.image}">

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ₹${product.price}
                </div>

                <button
                    onclick="addToCart(${product.id})">

                    Add to Cart 🛒

                </button>

            </div>

        `;

    });

}


function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    const existing =
        cart.find(p => p.id === id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    updateCart();

}


function updateCart() {

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;
    let count = 0;

    cart.forEach(item => {

        total +=
            item.price * item.quantity;

        count += item.quantity;

        container.innerHTML += `

            <div class="cart-item">

                <b>${item.name}</b>

                <br>

                ₹${item.price}
                × ${item.quantity}

            </div>

        `;

    });

    document.getElementById("total")
        .innerText = total;

    document.getElementById("cartCount")
        .innerText = count;

}


async function placeOrder() {

    if (cart.length === 0) {

        alert("Cart is empty!");

        return;
    }


    const customerName =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const address =
        document.getElementById("address").value;

    const city =
        document.getElementById("city").value;

    const pincode =
        document.getElementById("pincode").value;


    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.quantity,
            0
        );


    const response =
        await fetch("/api/orders", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                customerName,
                phone,
                address,
                city,
                pincode,

                items: cart,

                total

            })

        });


    const result =
        await response.json();


    if (result.success) {

        document.getElementById("message")
            .innerHTML =
            "✅ Order placed! Your Order ID is " +
            result.orderId;

        cart = [];

        updateCart();

    } else {

        document.getElementById("message")
            .innerHTML =
            "❌ " + result.message;

    }

}


displayProducts();

updateCart();

</script>

</body>

</html>
